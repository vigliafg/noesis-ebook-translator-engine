name: build-releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-15-intel
            name: macos-x64
          - os: macos-15
            name: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-tui.txt pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          # Console tool: NO --windowed. The .exe/.bin opens in the terminal.
          ICON=""
          case "$RUNNER_OS" in
            Windows) [ -f assets/noesis-ebook-translator-engine.ico ] && ICON="--icon assets/noesis-ebook-translator-engine.ico" ;;
            macOS)   [ -f assets/noesis-ebook-translator-engine.icns ] && ICON="--icon assets/noesis-ebook-translator-engine.icns" ;;
          esac
          # `--collect-all textual` is best effort: if it fails (e.g. Textual
          # missing), retry without it so the build is not blocked.
          pyinstaller \
            --onefile \
            --clean \
            --noconfirm \
            --name noesis-ebook-translator-engine \
            $ICON \
            --collect-all textual \
            noesis_ebook_translator_engine.py \
          || pyinstaller \
            --onefile \
            --clean \
            --noconfirm \
            --name noesis-ebook-translator-engine \
            $ICON \
            noesis_ebook_translator_engine.py

      - name: Build NSIS installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install nsis -y --no-progress
          # Extract version from the git tag (strip leading 'v')
          V="${GITHUB_REF#refs/tags/v}"
          # Fallback for manual runs / non-tag pushes
          [[ "$V" == "$GITHUB_REF" ]] && V="0.0.0-dev"
          echo "NSIS VERSION=$V"
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          MSYS_NO_PATHCONV=1 makensis "/DVERSION=$V" installer.nsi
          ls -la noesis-ebook-translator-engine-*-setup.exe

      - name: Package artifact
        shell: bash
        env:
          BASE: noesis-ebook-translator-engine-${{ matrix.name }}
        run: |
          case "$RUNNER_OS" in
            Windows)
              mv "dist/noesis-ebook-translator-engine.exe" "$BASE.exe"
              # Rename NSIS installer to include the platform in the filename.
              SETUP=$(echo noesis-ebook-translator-engine-*-setup.exe)
              if [ -f "$SETUP" ]; then
                mv "$SETUP" "$BASE-setup.exe"
              fi
              ;;
            macOS)
              # The standalone binary is wrapped in a .dmg for distribution.
              mkdir -p dmg
              cp "dist/noesis-ebook-translator-engine" dmg/
              # hdiutil può fallire con EBUSY transitorio sui runner.
              for attempt in 1 2 3; do
                hdiutil create -volname "Noesis Ebook Translator Engine" \
                  -srcfolder dmg -ov -format UDZO "$BASE.dmg" && break
                sleep 5
              done
              test -f "$BASE.dmg"
              ;;
          esac
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: noesis-ebook-translator-engine-${{ matrix.name }}
          path: noesis-ebook-translator-engine-${{ matrix.name }}*
          if-no-files-found: error

  linux-appimage:
    name: linux-x86_64-appimage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-tui.txt pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          # Console tool: NO --windowed.
          pyinstaller \
            --onefile \
            --clean \
            --noconfirm \
            --name noesis-ebook-translator-engine \
            --collect-all textual \
            noesis_ebook_translator_engine.py \
          || pyinstaller \
            --onefile \
            --clean \
            --noconfirm \
            --name noesis-ebook-translator-engine \
            noesis_ebook_translator_engine.py

      - name: Package AppImage
        shell: bash
        run: |
          set -e
          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin"

          # self-contained binary
          cp "dist/noesis-ebook-translator-engine" "$APPDIR/usr/bin/noesis-ebook-translator-engine"
          chmod +x "$APPDIR/usr/bin/noesis-ebook-translator-engine"

          # icon (256x256 PNG)
          cp assets/noesis-ebook-translator-engine.png "$APPDIR/noesis-ebook-translator-engine.png"

          # desktop entry (console app → Terminal=true)
          cat > "$APPDIR/noesis-ebook-translator-engine.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Noesis Ebook Translator Engine
          Exec=noesis-ebook-translator-engine %F
          Icon=noesis-ebook-translator-engine
          Categories=Office;Utility;
          Comment=Translate EPUB ebooks from the terminal (CLI + TUI)
          Terminal=true
          EOF

          # AppRun launcher
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/noesis-ebook-translator-engine" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          # appimagetool (run without FUSE via --appimage-extract-and-run)
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract-and-run \
            "$APPDIR" "noesis-ebook-translator-engine-x86_64.AppImage"
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: noesis-ebook-translator-engine-linux-x86_64-appimage
          path: noesis-ebook-translator-engine-x86_64.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, linux-appimage]
    runs-on: ubuntu-latest
    steps:
      # Serve per RELEASE_NOTES.md (body_path).
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: RELEASE_NOTES.md
          # Idempotente: un re-tag può riusare la release esistente.
          overwrite_files: true
